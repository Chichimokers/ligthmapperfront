version: "3.9"

services:
  lightmapper:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    image: lightmapper:latest
    container_name: lightmapper-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - lightmapper-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - /var/log/nginx:/var/log/nginx:rw

networks:
  lightmapper-network:
    driver: bridge
